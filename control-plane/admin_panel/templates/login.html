<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود — پنل مدیریت {{ app_name }}</title>
  <link rel="stylesheet" href="/admin/static/admin.css?v=1">
</head>
<body>
<div class="login-wrap">
  <form class="login-box" method="post" action="/admin/login">
    <h1>{{ app_name }}</h1>
    <p class="sub">پنل مدیریت</p>

    {% if error %}
      <div class="alert alert-bad">{{ error }}</div>
    {% endif %}

    <label for="username">نام کاربری</label>
    <input id="username" name="username" type="text" autocomplete="username"
           value="{{ username or '' }}" required autofocus dir="ltr">

    <label for="password">رمز عبور</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required dir="ltr">

    <button type="submit">ورود</button>
  </form>
</div>
</body>
</html>
